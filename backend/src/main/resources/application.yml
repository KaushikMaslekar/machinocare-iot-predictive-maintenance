server:
  port: 8080

spring:
  application:
    name: machinocare-backend

  # Database configuration (MongoDB)
  data:
    mongodb:
      uri: mongodb://${MONGO_HOST:localhost}:${MONGO_PORT:27017}/${MONGO_DB:machinocare}
      auto-index-creation: true

# MachinoCare IoT & MQTT Settings
machinocare:
  mqtt:
    broker-url: tcp://${MQTT_HOST:localhost}:${MQTT_PORT:1883}
    client-id: machinocare-backend-${random.uuid}
    topics:
      status: machinocare/v1/devices/+/status
      telemetry: machinocare/v1/devices/+/telemetry
      condition: machinocare/v1/devices/+/condition
    qos: 1
    completion-timeout-ms: 5000

logging:
  level:
    root: INFO
    com.machinocare: DEBUG
    org.springframework.integration.mqtt: INFO
