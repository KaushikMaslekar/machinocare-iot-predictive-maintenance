services:
  # 1. MQTT Broker: Eclipse Mosquitto
  mosquitto:
    image: eclipse-mosquitto:2.0
    container_name: machinocare-mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/config/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    networks:
      - machinocare-net

  # 2. Database: MongoDB 7.0
  mongodb:
    image: mongo:7.0
    container_name: machinocare-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: machinocare
    volumes:
      - mongo_data:/data/db
    networks:
      - machinocare-net

networks:
  machinocare-net:
    driver: bridge

volumes:
  mongo_data:
