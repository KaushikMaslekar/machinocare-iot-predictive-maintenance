# Eclipse Mosquitto Configuration for MachinoCare (Local Dev)

# Listen on port 1883 for all network interfaces (IPv4 & IPv6)
listener 1883 0.0.0.0

# Allow connections without username/password in local development
allow_anonymous true

# Logging settings
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
connection_messages true
log_timestamp true
